<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Faint wide shadow for overlapping front panel -->
    <filter id="panelShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-18" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.58" />
    </filter>
    <filter id="cardPropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-14" dy="-12" stdDeviation="22" flood-color="#000000" flood-opacity="0.72" />
    </filter>

    <!-- Warm metallic micro-weave texture (#C98A3B - #E0A44E) for bottom-right card prop -->
    <pattern id="parquMetallicPattern" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="28" height="28" fill="#17120B" />
      <path d="M0 14 H28 M14 0 V28" stroke="#C98A3B" stroke-width="1.2" stroke-opacity="0.3" />
      <circle cx="14" cy="14" r="3.5" fill="#E0A44E" fill-opacity="0.22" />
      <circle cx="0" cy="0" r="2" fill="#C98A3B" fill-opacity="0.32" />
      <circle cx="28" cy="28" r="2" fill="#C98A3B" fill-opacity="0.32" />
    </pattern>

    <clipPath id="stageClip">
      <rect width="1200" height="630" />
    </clipPath>
  </defs>

  <g clip-path="url(#stageClip)" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- 1. GROUND: Full-bleed solid black (#000000), left ~40% open negative space -->
    <rect width="1200" height="630" fill="#000000" />

    <!-- 2. BRAND ANCHOR: Bottom-left rounded square (110x110px, 26px radius, 60px safe margin) -->
    <rect x="60" y="460" width="110" height="110" rx="26" fill="#0033FF" />
    <text x="115" y="538" text-anchor="middle" fill="#FFFFFF" font-size="68" font-weight="900" letter-spacing="-3">P</text>

    <!-- 3A. BACK PANEL: Light UI screen (348px wide, 26px radius, left ~60% visible) -->
    <g transform="translate(475, 96)">
      <rect width="348" height="468" rx="26" fill="#FFFFFF" />
      
      <!-- Section Label -->
      <text x="28" y="44" fill="#000000" font-size="19" font-weight="700" letter-spacing="-0.4">Saldo Parqu</text>
      
      <!-- Primary Balance -->
      <text x="28" y="88" fill="#000000" font-size="38" font-weight="900" letter-spacing="-1.5">$320.00</text>
      
      <!-- Two small muted metadata values (#8A8F98) -->
      <text x="28" y="114" fill="#8A8F98" font-size="12.5" font-weight="500">Placa XYZ-7842</text>
      <text x="28" y="132" fill="#8A8F98" font-size="12.5" font-weight="500">Pase NFC Activo • Sin comisión</text>

      <!-- Two full-radius pill buttons -->
      <rect x="28" y="152" width="88" height="34" rx="17" fill="#F2F3F5" />
      <text x="72" y="173" text-anchor="middle" fill="#000000" font-size="12.5" font-weight="700">Recargar</text>

      <rect x="126" y="152" width="92" height="34" rx="17" fill="#F2F3F5" />
      <text x="172" y="173" text-anchor="middle" fill="#000000" font-size="12.5" font-weight="700">Autocobro</text>

      <!-- Divider -->
      <line x1="28" y1="210" x2="320" y2="210" stroke="#ECEEF2" stroke-width="1" />

      <!-- Row 1: Smaller balance + caption + mini sparkline -->
      <text x="28" y="246" fill="#000000" font-size="25" font-weight="700" letter-spacing="-0.8">$6.00</text>
      <text x="28" y="266" fill="#8A8F98" font-size="12.5" font-weight="500">Tarifa por hora</text>
      <path d="M155 252 L166 247 L176 249 L188 240 L202 236" stroke="#0033FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Row 2: Smaller stat + caption -->
      <text x="28" y="316" fill="#000000" font-size="25" font-weight="700" letter-spacing="-0.8">00:14:25</text>
      <text x="28" y="336" fill="#8A8F98" font-size="12.5" font-weight="500">Cronómetro al segundo</text>

      <!-- Row 3: Smaller balance + caption -->
      <text x="28" y="386" fill="#000000" font-size="25" font-weight="700" letter-spacing="-0.8">$180.00</text>
      <text x="28" y="406" fill="#8A8F98" font-size="12.5" font-weight="500">Límite automático</text>
    </g>

    <!-- 3B & 4. FRONT PANEL: Solid accent #0033FF screen overlapping back panel by ~35% + Giant "$6" Hero Figure -->
    <g transform="translate(700, 56)" filter="url(#panelShadow)">
      <rect width="352" height="484" rx="26" fill="#0033FF" />

      <!-- Small utility icon top-left -->
      <circle cx="42" cy="42" r="18" fill="#FFFFFF" fill-opacity="0.16" />
      <rect x="35" y="35" width="6" height="6" rx="1" stroke="#FFFFFF" stroke-width="1.8" />
      <rect x="43" y="35" width="6" height="6" rx="1" stroke="#FFFFFF" stroke-width="1.8" />
      <rect x="35" y="43" width="6" height="6" rx="1" stroke="#FFFFFF" stroke-width="1.8" />
      <rect x="43" y="43" width="6" height="6" rx="1" fill="#FFFFFF" />

      <!-- Small round avatar top-right -->
      <circle cx="310" cy="42" r="18" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="310" y="46" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">SS</text>

      <!-- Sparse column of keypad-style digits running down left edge -->
      <g fill="#FFFFFF" fill-opacity="0.35" font-size="16" font-weight="700" text-anchor="middle">
        <text x="26" y="180">1</text>
        <text x="26" y="218">4</text>
        <text x="26" y="256">7</text>
        <text x="26" y="294">•</text>
        <text x="26" y="332">0</text>
      </g>

      <!-- 4. HERO FIGURE: "$6" at optical centre of front panel (~168px, heaviest weight, tight tracking) -->
      <text x="184" y="292" text-anchor="middle" fill="#FFFFFF" font-size="168" font-weight="900" letter-spacing="-9">$6</text>
      <text x="184" y="330" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.82" font-size="13" font-weight="700" letter-spacing="2.2">MXN / HORA OFICIAL</text>

      <!-- Subtle bottom metadata -->
      <text x="28" y="454" fill="#FFFFFF" fill-opacity="0.75" font-size="12.5" font-weight="600">Parqu Pass</text>
      <text x="324" y="454" text-anchor="end" fill="#FFFFFF" fill-opacity="0.75" font-size="12.5" font-weight="600">XYZ-7842</text>
    </g>

    <!-- 5. TEXTURE PROP: Bottom-right cropped card (~460x260px, 20px radius, bleeding off right & bottom) -->
    <g transform="translate(830, 435)" filter="url(#cardPropShadow)">
      <rect width="460" height="260" rx="20" fill="url(#parquMetallicPattern)" stroke="#E0A44E" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="32" y="44" fill="#E0A44E" font-size="12" font-weight="700" letter-spacing="2">NFC PASS</text>
      <text x="330" y="46" text-anchor="end" fill="#E0A44E" font-size="20" font-weight="900" letter-spacing="-0.6">PARQU</text>
      <text x="32" y="138" fill="#C98A3B" font-size="12.5" font-weight="600">Tarjeta Digital Metropolitana</text>
      <text x="32" y="164" fill="#E0A44E" font-size="18" font-weight="800" letter-spacing="1.5">XYZ-7842</text>
    </g>
  </g>
</svg>
